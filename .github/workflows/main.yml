name: ci

on:
  push:
    branches:
      - "master"

# Keep image publication and deployment ordered across pushes. Do not interrupt
# a running publication/deployment when another commit arrives.
concurrency:
  group: dtl-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Run Ruff Linter
        uses: astral-sh/ruff-action@v1
        with:
          version: "0.15.7"
          args: "check"
      - name: Run Ruff Formatter
        uses: astral-sh/ruff-action@v1
        with:
          version: "0.15.7"
          args: "format --check"

  build:
    needs: [lint, test]
    runs-on: ubuntu-24.04
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
      -
        name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Set Variables
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      -
        name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/dtl:latest
          build-args: |
            COMMIT_SHA=${{ steps.vars.outputs.sha_short }}

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Queue dtl deployment in Arcane
        env:
          ARCANE_DTL_WEBHOOK_URL: ${{ secrets.ARCANE_DTL_WEBHOOK_URL }}
          ARCANE_CF_CLIENT_ID: ${{ secrets.ARCANE_CF_CLIENT_ID }}
          ARCANE_CF_CLIENT_SECRET: ${{ secrets.ARCANE_CF_CLIENT_SECRET }}
        run: |
          if [ -z "$ARCANE_DTL_WEBHOOK_URL" ]; then
            echo "::error::ARCANE_DTL_WEBHOOK_URL is not configured"
            exit 1
          fi
          if [ -z "$ARCANE_CF_CLIENT_ID" ] || [ -z "$ARCANE_CF_CLIENT_SECRET" ]; then
            echo "::error::Cloudflare deployment service credentials are not configured"
            exit 1
          fi
          # 202 means queued, not deployed. Arcane records the eventual outcome
          # in its Activity Center. Never print the tokenized URL or use -v.
          status=$(curl --silent --show-error --output response.json \
            --write-out '%{http_code}' --connect-timeout 15 --max-time 60 \
            --header "CF-Access-Client-Id: $ARCANE_CF_CLIENT_ID" \
            --header "CF-Access-Client-Secret: $ARCANE_CF_CLIENT_SECRET" \
            --request POST "$ARCANE_DTL_WEBHOOK_URL")
          if [ "$status" != "202" ]; then
            echo "::error::Arcane rejected the deployment trigger (HTTP $status)"
            exit 1
          fi
          echo "Arcane accepted the dtl deployment. Check its Activity Center for completion." >> "$GITHUB_STEP_SUMMARY"
